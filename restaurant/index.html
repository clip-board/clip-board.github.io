    const a=document.createElement("a")
    const parts=v.split("/")
    
    parts.shift()
    parts.shift()
    
    const title=parts.join("/")
    
    if(parts[0].includes("tiktok"))
     parts.shift()
     
    let text=parts[0]
    
    if(text[0]=="@")
     text=text.slice(1)
   
    td1.textContent=n
    td1.style.fontWeight="bold"
    td1.style.textAlign="right"
    
    a.href=v
    a.target="_blank"
    a.title=title
    a.textContent=text
    
    td2.appendChild(a)
    tr.appendChild(td1)
    tr.appendChild(td2)
    content.appendChild(tr)
